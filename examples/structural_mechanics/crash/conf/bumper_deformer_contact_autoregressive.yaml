defaults:
  - bumper_meshgeoflare_adapter_flare_autoregressive
  - _self_

experiment_name: Bumper-DeFormer-FLARE-AR-Contact

# Keep the baseline's 10,000 epochs, precision, and closed-loop rollout.
model:
  use_contact: true
  enable_contact: true
  enable_node_contact: true
  enable_cylinder_contact: true
  contact_graph_backend: nearest_k
  contact_search_implementation: warp
  contact_max_neighbors: 16
  node_contact_radius: 10.0
  exclude_same_component: false
  contact_dim: 8
  contact_gate_init: 1.0e-3
  contact_include_velocity: false
  contact_smooth_cutoff: false
