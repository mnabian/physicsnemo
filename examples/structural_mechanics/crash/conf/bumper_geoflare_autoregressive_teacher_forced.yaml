# @package _global_
hydra:
  job:
    chdir: true
  run:
    dir: ./outputs/

experiment_name: "Bumper-GeoFLARE-Autoregressive-TeacherForced"

defaults:
  - reader: vtp
  - datapipe: point_cloud
  - model: geoflare_autoregressive_teacher_forced
  - training: default
  - inference: default
  - _self_

training:
  raw_data_dir: ???
  raw_data_dir_validation: ???
  global_features_filepath: ???
  optimizer: muon
  amp: true
  amp_dtype: float16
  seed: 42
  num_time_steps: 51
  num_training_samples: 121
  num_validation_samples: 5
  epochs: 2500
  validation_freq: 10
  save_checkpoint_freq: 10
  early_stopping_patience: 0

inference:
  raw_data_dir_test: ???

datapipe:
  static_features: []
  dynamic_targets:
    - effective_plastic_strain
    - stress_vm
  global_features:
    - velocity_x
    - thickness_scale
    - rwall_origin_y
  sample_type: all_time_steps

model:
  functional_dim: 3
  out_dim: 5
  global_dim: 3
  attention_type: GALE_FA
  attn_scale: null
