# @package _global_
hydra:
  job:
    chdir: true
  run:
    dir: ./outputs/

experiment_name: "Bumper-MeshGeoFLARE-LatentMPNN-FLARE-AR"

# This latent-pre-MPNN topology is not checkpoint-compatible with the earlier
# input-space residual adapter. Start this experiment from a fresh model state.

defaults:
  - reader: vtp
  - datapipe: graph
  - model: meshgeoflare_adapter_flare_autoregressive
  - training: default
  - inference: default
  - _self_

# Retain the full bumper-beam optimization budget. Training, validation, and
# inference all use the same fully closed-loop autoregressive dynamics. This is
# intentionally identical to the matched GeoFLARE control recipe.
training:
  raw_data_dir: ???
  raw_data_dir_validation: ???
  global_features_filepath: ???
  optimizer: muon
  amp: true
  amp_dtype: float16
  seed: 42
  num_time_steps: 51
  num_training_samples: 121
  num_validation_samples: 5
  epochs: 10000
  validation_freq: 10
  save_checkpoint_freq: 100
  early_stopping_patience: 0
  acceleration_loss_weight: 0.0

inference:
  raw_data_dir_test: ???

datapipe:
  static_features: []
  dynamic_targets:
    - effective_plastic_strain
    - stress_vm
  global_features:
    - velocity_x
    - thickness_scale
    - rwall_origin_y
  sample_type: all_time_steps
