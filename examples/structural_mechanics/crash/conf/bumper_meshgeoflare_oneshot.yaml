# Bumper beam crash experiment using FLARE++ plus mesh message passing (one-shot).

# @package _global_
hydra:
  job:
    chdir: True
  run:
    dir: ./outputs/

experiment_name: "Bumper-MeshGeoFLARE++"

defaults:
  - reader: vtp
  - datapipe: graph
  - model: meshgeoflare_one_shot
  - training: default
  - inference: default
  - _self_

# The training recipe intentionally matches bumper_geoflare_oneshot.yaml.
training:
  raw_data_dir: ???
  raw_data_dir_validation: ???
  global_features_filepath: ???
  optimizer: muon
  num_time_steps: 51
  num_training_samples: 121
  num_validation_samples: 5

inference:
  raw_data_dir_test: ???

datapipe:
  static_features: []
  dynamic_targets:
    - effective_plastic_strain
    - stress_vm
  global_features:
    - velocity_x
    - thickness_scale
    - rwall_origin_y
  sample_type: all_time_steps

model:
  functional_dim: 3
  out_dim: 250
  global_dim: 3
  attention_type: "GALE_FPP"
  attn_scale: null
