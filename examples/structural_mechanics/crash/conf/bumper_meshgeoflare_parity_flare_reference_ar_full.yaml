# @package _global_
defaults:
  - bumper_meshgeoflare_parity_flare_reference_ar
  - _self_

experiment_name: "Bumper-MeshGeoFLARE-Parity-FLARE-FixedEdges-AR-Full"

# Full matched-backbone experiment. The inherited model uses the same GALE_FA
# attention configuration as the plain GeoFLARE autoregressive baseline; only
# the fixed-connectivity mesh residual branches are added.
training:
  epochs: 2500

model:
  attention_type: GALE_FA
  attn_scale: null
