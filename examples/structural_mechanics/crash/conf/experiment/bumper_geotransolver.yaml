# Bumper beam crash experiment using GeoTransolver (autoregressive rollout).
# Usage: python train.py +experiment=bumper_geotransolver

# @package _global_

defaults:
  - override /reader: vtp
  - override /datapipe: point_cloud
  - override /model: geotransolver_autoregressive_rollout_training

# ┌───────────────────────────────────────────┐
# │                   Data                    │
# └───────────────────────────────────────────┘

training:
  raw_data_dir: "/code/mnabian/workspace/bumper/physicsnemo-curator/examples/structural_mechanics/crash/data_new/train"
  raw_data_dir_validation: "/code/mnabian/workspace/bumper/physicsnemo-curator/examples/structural_mechanics/crash/data_new/validation"
  global_features_filepath: "/code/datasets/bumper_crush/global_features.json"

  # ┌───────────────────────────────────────────┐
  # │                 Dataset                   │
  # └───────────────────────────────────────────┘

  num_time_steps: 51
  num_training_samples: 121
  num_validation_samples: 5

inference:
  raw_data_dir_test: "/code/mnabian/workspace/bumper/physicsnemo-curator/examples/structural_mechanics/crash/data_new/test"

# ┌───────────────────────────────────────────┐
# │            Datapipe features              │
# └───────────────────────────────────────────┘

datapipe:
  dynamic_targets:
    - effective_plastic_strain
    - stress_vm
  global_features:
    - velocity_x
    - thickness_scale
    - rwall_origin_y
