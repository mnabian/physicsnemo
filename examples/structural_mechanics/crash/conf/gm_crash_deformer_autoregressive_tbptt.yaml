# Full-car, closed-loop DeFormer training with random truncated BPTT windows.
# Validation and inference always roll through the complete held-out trajectory.

hydra:
  job:
    chdir: true
  run:
    dir: ./outputs/

experiment_name: "GM-Crash-DeFormer-FLARE-AR-TBPTT"

defaults:
  - reader: vtp
  - datapipe: graph
  - model: deformer_full_car_autoregressive
  - training: default
  - inference: default
  - _self_

training:
  raw_data_dir: ???
  raw_data_dir_validation: ???
  global_features_filepath: null
  optimizer: muon
  amp: true
  amp_dtype: bfloat16
  manual_gradient_allreduce: true
  seed: 42

  num_time_steps: 26
  num_training_samples: 127
  num_validation_samples: 8

  # A full-car graph has 28.1x more nodes than the bumper graph. Use a fixed,
  # shorter budget and a compressed cosine schedule; do not early-stop.
  epochs: 500
  start_lr: 2.0e-4
  end_lr: 1.0e-6
  validation_freq: 50
  # Frequent checkpoints bound lost work at the four-hour EOS wall-time limit.
  save_checkpoint_freq: 10
  early_stopping_patience: 0
  acceleration_loss_weight: 0.0

inference:
  raw_data_dir_test: ???

datapipe:
  static_features: [thickness]
  dynamic_targets: []
  global_features: null

  # Two observed frames provide a per-node initial velocity because the VTPs do
  # not contain an explicit velocity field. Each training draw selects a random
  # current frame and rolls four transitions closed-loop from that state.
  sample_type: random_time_window
  initial_history_steps: 2
  rollout_window_steps: 4
  windows_per_sample: 1
