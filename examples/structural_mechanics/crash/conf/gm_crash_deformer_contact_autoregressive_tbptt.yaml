defaults:
  - gm_crash_deformer_autoregressive_tbptt
  - _self_

experiment_name: GM-Crash-DeFormer-FLARE-AR-TBPTT-Contact

# Preserve the baseline's splits, optimization budget, and closed-loop TBPTT.
# Start a fresh model/optimizer: the contact block adds new parameters.
model:
  use_contact: true
  enable_contact: true
  enable_node_contact: true
  enable_cylinder_contact: false
  contact_graph_backend: nearest_k
  contact_search_implementation: warp
  contact_max_neighbors: 16
  node_contact_radius: 10.0  # physical center distance, in dataset length units
  exclude_same_component: false  # permit folded-shell self-contact
  base_shell_thickness: 0.0  # use supplied nodal thickness, no invented fallback
  contact_dim: 8
  contact_gate_init: 1.0e-3
  contact_include_velocity: false
  contact_smooth_cutoff: false
