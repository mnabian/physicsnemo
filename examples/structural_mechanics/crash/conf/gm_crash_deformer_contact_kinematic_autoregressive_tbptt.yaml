defaults:
  - gm_crash_deformer_contact_autoregressive_tbptt
  - _self_

experiment_name: GM-Crash-DeFormer-FLARE-AR-TBPTT-KinematicContact

# Motion-aware variant: live relative velocities and a compact smooth envelope.
model:
  contact_dim: 12
  contact_include_velocity: true
  contact_velocity_scale: 1000.0  # dataset length units / second
  contact_smooth_cutoff: true
