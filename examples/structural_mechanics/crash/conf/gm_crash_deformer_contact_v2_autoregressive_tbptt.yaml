defaults:
  - gm_crash_deformer_contact_offloaded_autoregressive_tbptt
  - _self_

experiment_name: GM-Crash-DeFormer-FLARE-AR-TBPTT-ContactV2

reader:
  include_contact_topology: true

datapipe:
  contact_exclusion_hops: 2
  contact_require_elements: true
  window_seed: ${training.seed}

model:
  contact_selection_taper: true
  contact_normal_epsilon: 0.1  # millimeters; direction Jacobian bounded by 10/mm
  contact_activation_distance: 5.0  # shell-clearance proxy band, NOT a surface gap
  contact_isolate_rng: true
  contact_prune_zero_weight: true

training:
  deterministic: true
  reproducible_sampling: true
  sampler_seed: 0  # preserve the existing distributed case-shuffle order
