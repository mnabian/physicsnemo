_target_: rollout.MeshGeoFLAREAutoregressive
_convert_: all

# Corrected DeFormer: native GeoFLARE projection, a latent-space structural
# pre-MPNN, the complete FLARE backbone, and two output-refinement MPNNs.
# The full-car files provide nodal thickness but no run-level global features.
functional_dim: 4  # normalized velocity (3) + normalized thickness (1)
out_dim: 3         # normalized acceleration
geometry_dim: 3
global_dim: null
n_hidden: 256
n_head: 8
slice_num: 128
n_layers: 6
use_te: false
time_input: false
include_local_features: true
attention_type: GALE_FA
attn_scale: null

input_dim_edges: 4
mesh_hidden_dim: 256
num_pre_processor_layers: 1
num_post_processor_layers: 2
num_pre_processor_checkpoint_segments: 1
num_post_processor_checkpoint_segments: 2
mesh_pre_residual_gate_init: 0.0
mesh_post_residual_gate_init: 0.0

# Geometry conditions both mesh residual stages. There are no global scalars in
# gm_crash_vtp, so global mesh conditioning is intentionally disabled.
mesh_context_fusion: pre_post
mesh_context_use_global: false

num_time_steps: ${training.num_time_steps}
dt: 5.0e-3
initial_velocity_mode: previous_coords
rollout_steps_from_target: true
checkpoint_rollout: true
teacher_forcing: false
node_input_mode: velocity

# First full-car experiment isolates recurrent structural dynamics. Contact can
# be enabled in a matched follow-up after the displacement baseline is measured.
use_contact: false
enable_contact: false
enable_node_contact: false
enable_cylinder_contact: false
