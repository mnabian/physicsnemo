_target_: rollout.GeoTransolverAutoregressive
_convert_: all

# Matched FLARE control for the MeshGeoFLARE latent-pre-MPNN experiment.
functional_dim: 3
out_dim: 5
geometry_dim: 3
global_dim: 3
n_hidden: 256
n_head: 8
slice_num: 128
n_layers: 6
use_te: false
time_input: false
include_local_features: true
attention_type: GALE_FA
attn_scale: null

num_time_steps: ${training.num_time_steps}
dt: 5.0e-3
velocity_feature: velocity_x
velocity_axis: 0
velocity_unit_scale: 1000.0
checkpoint_rollout: true
teacher_forcing: false
