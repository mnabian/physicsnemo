_target_: rollout.GeoTransolverAutoregressive
_convert_: all

# Plain point-cloud GeoTransolver backbone with FLARE attention. Geometry and
# global bumper parameters enter through the standard GeoTransolver arguments;
# there are no mesh message-passing or geometry-sidecar modules.
functional_dim: 3
out_dim: 5
geometry_dim: 3
global_dim: 3
n_hidden: 256
n_head: 8
slice_num: 128
n_layers: 6
use_te: false
time_input: false
include_local_features: true
attention_type: GALE_FA
attn_scale: null

# Predict acceleration plus the two scalar crash fields at every transition.
num_time_steps: ${training.num_time_steps}
dt: 5.0e-3
velocity_feature: velocity_x
velocity_axis: 0
velocity_unit_scale: 1000.0
checkpoint_rollout: true

# Training uses independent ground-truth transitions. eval() always feeds
# predictions back into the next step for a closed-loop rollout.
teacher_forcing: true
