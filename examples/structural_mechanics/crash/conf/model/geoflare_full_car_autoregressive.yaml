_target_: rollout.GeoTransolverAutoregressive
_convert_: all

# Matched point-cloud GeoTransolver baseline using the same FLARE attention
# backbone as DeFormer, without either structural message-passing adapter.
functional_dim: 4  # normalized velocity (3) + normalized thickness (1)
out_dim: 3         # normalized acceleration
geometry_dim: 3
global_dim: null
n_hidden: 256
n_head: 8
slice_num: 128
n_layers: 6
use_te: false
time_input: false
include_local_features: true
attention_type: GALE_FA
attn_scale: null

num_time_steps: ${training.num_time_steps}
dt: 5.0e-3
initial_velocity_mode: previous_coords
rollout_steps_from_target: true
checkpoint_rollout: true
teacher_forcing: false
