_target_: rollout.MeshGeoFLAREAutoregressive
_convert_: all

# Keep the complete FLARE backbone and insert structural message passing after
# GeoFLARE's native input projection. The pre branch therefore operates on the
# 256-channel node latent rather than decoding through the 3-channel velocity
# input. Geometry and globals additionally condition both mesh residual stages.
functional_dim: 3
out_dim: 5
geometry_dim: 3
global_dim: 3
n_hidden: 256
n_head: 8
slice_num: 128
n_layers: 6
use_te: false
time_input: false
include_local_features: true
attention_type: GALE_FA
attn_scale: null

# One latent structural MPNN before FLARE attention and two output-refinement
# MPNNs after the complete backbone. ReZero-style gates let the transition model
# begin at exact GeoFLARE parity.
input_dim_edges: 4
mesh_hidden_dim: 256
num_pre_processor_layers: 1
num_post_processor_layers: 2
num_pre_processor_checkpoint_segments: 1
num_post_processor_checkpoint_segments: 2
mesh_pre_residual_gate_init: 0.0
mesh_post_residual_gate_init: 0.0

# The strongest controlled one-shot context path: live geometry tokens, node
# coordinates, and normalized simulation globals condition both mesh stages.
mesh_context_fusion: pre_post
mesh_context_use_global: true

num_time_steps: ${training.num_time_steps}
dt: 5.0e-3
velocity_feature: velocity_x
velocity_axis: 0
velocity_unit_scale: 1000.0
checkpoint_rollout: true
teacher_forcing: false
node_input_mode: velocity

# Phase-one reference: isolate recurrent dynamics before adding contact.
use_contact: false
enable_contact: false
enable_node_contact: false
enable_cylinder_contact: false
