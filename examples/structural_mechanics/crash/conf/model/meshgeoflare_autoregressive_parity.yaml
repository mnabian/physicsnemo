_target_: rollout.MeshGeoFLAREAutoregressive
_convert_: all

# Match the point-cloud autoregressive GeoFLARE input contract exactly. Current
# geometry and normalized global parameters enter only through GeoFLARE's
# dedicated context paths; the functional input contains normalized velocity.
functional_dim: 3
out_dim: 5
geometry_dim: 3
global_dim: 3
n_hidden: 256
n_head: 8
slice_num: 128
n_layers: 6
use_te: false
time_input: false
include_local_features: true
attention_type: GALE_FA
attn_scale: null

# Additive structural-mesh message passing around the complete GeoFLARE
# backbone. ReZero-style gates make the mesh branches exact identities at
# initialization, allowing a numerical backbone-parity check.
input_dim_edges: 4
mesh_hidden_dim: 256
num_pre_processor_layers: 1
num_post_processor_layers: 2
num_pre_processor_checkpoint_segments: 1
num_post_processor_checkpoint_segments: 2
mesh_pre_residual_gate_init: 0.0
mesh_post_residual_gate_init: 0.0

mesh_context_fusion: none
mesh_context_use_global: false

num_time_steps: ${training.num_time_steps}
dt: 5.0e-3
velocity_feature: velocity_x
velocity_axis: 0
velocity_unit_scale: 1000.0
checkpoint_rollout: true
teacher_forcing: true
node_input_mode: velocity

use_contact: false
enable_contact: false
enable_node_contact: false
enable_cylinder_contact: false
