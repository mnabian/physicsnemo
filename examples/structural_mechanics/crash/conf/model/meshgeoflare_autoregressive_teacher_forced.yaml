_target_: rollout.MeshGeoFLAREAutoregressive
_convert_: all

# Full-width GeoFLARE++ backbone. The six functional channels are the current
# normalized position and velocity; the three normalized bumper parameters are
# also broadcast to each node, matching the existing autoregressive wrapper.
functional_dim: 9
out_dim: 5
geometry_dim: 3
global_dim: 3
n_hidden: 256
n_head: 8
slice_num: 128
n_layers: 6
use_te: false
time_input: false
include_local_features: true
attention_type: GALE_FPP
# null selects the FLARE++ paper scale: dim_head ** -0.5.
attn_scale: null

# Additive structural-mesh message passing around the full GeoFLARE++ backbone.
input_dim_edges: 4
mesh_hidden_dim: 256
num_pre_processor_layers: 1
num_post_processor_layers: 2
num_pre_processor_checkpoint_segments: 1
num_post_processor_checkpoint_segments: 2

# Context-fusion ablations. ``none`` is the matched MeshGeoFLARE++ baseline.
mesh_context_fusion: none
mesh_context_use_global: false

# Predict acceleration plus the two scalar crash fields at every transition.
num_time_steps: ${training.num_time_steps}
dt: 5.0e-3
velocity_feature: velocity_x
velocity_axis: 0
velocity_unit_scale: 1000.0
checkpoint_rollout: true

# Training uses independent teacher-forced transitions. eval() always performs
# a closed-loop rollout, regardless of this flag.
teacher_forcing: true

# First experiment: no explicit node-to-node or rigid-cylinder contact graph.
# Cylinder position remains available through the normalized global embedding.
use_contact: false
enable_contact: false
enable_node_contact: false
enable_cylinder_contact: false
