_target_: rollout.MeshGeoFLAREOneShot
_convert_: all

# GeoFLARE++ backbone configuration. The mesh-only options below add parameters;
# they do not replace or shrink any part of this backbone.
functional_dim: 3
out_dim: 250
geometry_dim: 3
global_dim: null
n_hidden: 256
n_head: 8
slice_num: 128
n_layers: 6
use_te: false
time_input: false
include_local_features: true
attention_type: GALE_FPP
# null selects the FLARE++ paper scale: dim_head ** -0.5.
attn_scale: null

# Additive structural-mesh message passing around the full GeoFLARE++ backbone.
input_dim_edges: 4
mesh_hidden_dim: 256
num_pre_processor_layers: 1
num_post_processor_layers: 2
num_pre_processor_checkpoint_segments: 1
num_post_processor_checkpoint_segments: 2

# Context-fusion ablations. ``none`` preserves the exact MeshGeoFLARE++ baseline.
mesh_context_fusion: none
mesh_context_use_global: false

### Rollout parameters ###
num_time_steps: ${training.num_time_steps}
